[profile.default]
src = 'src'
out = 'out'
libs = ["dependencies"]
auto_detect_solc = true
optimizer = true
optimizer_runs = 20000
verbosity = 3
show_progress = true
gas_reports = ["TLAuctionHouse", "TLStacks721", "TLStacks1155"]
fs_permissions = [{ access = "read-write", path = "./"}]
ignored_warnings_from = ["test/**"]

[lint]
ignore = ["test/TLStacks721.t.sol", "test/TLStacks1155.t.sol", "test/TLAuctionHouse.t.sol", "script/Deploy.s.sol"]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 100
fail_on_revert = true
show_metrics = true

# CI sets FOUNDRY_PROFILE=ci, so it gets its own profile with the default campaign sizes
[profile.ci]
src = 'src'
out = 'out'
libs = ["dependencies"]
optimizer = true
optimizer_runs = 20000
fs_permissions = [{ access = "read-write", path = "./"}]
ignored_warnings_from = ["test/**"]

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 100
fail_on_revert = true

# long campaigns for pre-audit runs: `make test-deep`
[profile.deep]
src = 'src'
out = 'out'
libs = ["dependencies"]
optimizer = true
optimizer_runs = 20000
fs_permissions = [{ access = "read-write", path = "./"}]
ignored_warnings_from = ["test/**"]

[profile.deep.fuzz]
runs = 50000

[profile.deep.invariant]
runs = 2000
depth = 250
fail_on_revert = true
show_metrics = true

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARB_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
shape_sepolia = "${SHAPE_SEPOLIA_RPC_URL}"
mainnet = "${ETH_RPC_URL}"
arbitrum = "${ARB_RPC_URL}"
base = "${BASE_RPC_URL}"
shape = "${SHAPE_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_KEY}" }
arbitrum_sepolia = {  key = "${ARBISCAN_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
base_sepolia = {  key = "${BASESCAN_KEY}", url = "https://api-sepolia.basescan.org/api" }
mainnet = { key = "${ETHERSCAN_KEY}"}
arbitrum = { key = "${ARBISCAN_KEY}", url = "https://api.arbiscan.io/api" }
base = { key = "${BASESCAN_KEY}", url = "https://api.basescan.org/api" }

[soldeer]
recursive_deps=true

[dependencies]
forge-std = "1.9.4"
tl-creator-contracts = "4.1.1"
"@openzeppelin-contracts" = "5.6.1"
"@openzeppelin-contracts-upgradeable" = "5.6.1"
